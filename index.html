<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hollow Choir</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f0d;--ink:#d4cdb8;--dim:#8a8776;--line:#2b312c;--panel:#161b17;--lamp:#d9a95a;--blood:#b0443a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'IM Fell DW Pica',Georgia,serif;font-size:19px;min-height:100vh}
main{max-width:900px;margin:0 auto;padding:12px 12px 40px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:.35em .8em;cursor:pointer;border-radius:2px}
button:hover:not(:disabled){border-color:var(--lamp);color:var(--lamp)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,.o:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:'Courier Prime',monospace;font-size:.8rem}
.pips{display:flex;gap:6px}.pips i{width:10px;height:10px;border-radius:50%;border:1px solid var(--dim)}.pips i.on{background:var(--lamp);border-color:var(--lamp)}
.sm{font-family:'Courier Prime',monospace;font-size:.75rem;padding:.25em .6em}
#wrap{position:relative;border:1px solid var(--line);background:#000;--x:50%;--y:50%;overflow:hidden}
#scene{display:block;width:100%;height:auto}
#dark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 150px at var(--x) var(--y),transparent 0,rgba(0,0,0,.55) 55%,rgba(0,0,0,.96) 100%)}
.o{cursor:pointer;transition:filter .2s;filter:drop-shadow(0 6px 7px rgba(0,0,0,.65))}.o:hover,.o:focus{filter:drop-shadow(0 6px 7px rgba(0,0,0,.65)) brightness(1.35);outline:none}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.7) 100%)}
#tip{position:absolute;display:none;pointer-events:none;background:rgba(0,0,0,.85);border:1px solid var(--lamp);color:var(--ink);font-size:.8rem;padding:1px 8px;z-index:3;white-space:nowrap}
.pu{fill:var(--lamp);animation:pu 2s infinite}@keyframes pu{50%{opacity:.15}}
.fig{animation:fg 9s infinite}@keyframes fg{0%,60%{opacity:1}64%,90%{opacity:0}94%{opacity:1}}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:rotate(9deg)}}
.br{animation:br 3.5s ease-in-out infinite}@keyframes br{50%{opacity:.25}}
#cap{min-height:2.3em;padding:10px 4px;font-style:italic}#cap.bad{color:var(--blood)}
#inv{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;border-top:1px solid var(--line);padding-top:10px;min-height:56px}
.grp{display:flex;gap:8px;align-items:center}
.chip{display:flex;gap:3px;align-items:center;border:1px solid var(--line);background:var(--panel);padding:2px 8px;font-family:'Courier Prime',monospace;font-size:.85rem;color:var(--lamp)}
.chip .ic{color:var(--ink)}
.ic{vertical-align:middle}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.box{pointer-events:auto;background:rgba(10,12,10,.93);border:1px solid var(--line);padding:16px 20px;text-align:center;max-width:94%}
.box .row{display:flex;gap:10px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap}
.dg{font-family:'Courier Prime',monospace;font-size:2.2rem;color:var(--lamp);width:1.4em}
.col{display:flex;flex-direction:column;align-items:center}
.slot{width:48px;height:48px;border:1px solid var(--dim);border-radius:50%;display:flex;align-items:center;justify-content:center}
.lt{font-family:'Courier Prime',monospace;font-size:1.7rem;letter-spacing:.25em}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.title{text-align:center;padding:40px 10px}.title h1{font-weight:400;font-size:3rem;letter-spacing:.05em;margin:10px 0 20px;animation:fl 7s infinite}
@keyframes fl{0%,92%,100%{opacity:1}93%{opacity:.5}95%{opacity:.9}97%{opacity:.35}}
.end p{max-width:520px;margin:10px auto}.end .tag{color:var(--blood);margin-top:20px}
#whisper{position:fixed;left:0;right:0;bottom:22vh;text-align:center;color:var(--blood);font-style:italic;opacity:0;pointer-events:none;transition:opacity 1.2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="whisper" aria-hidden="true"></div>

const END=[
{ic:"Ledger",ic2:"Flame",need:["candle","ledger"],nt:"Needs flame and page.",l:"Burn the ledger",
 t:["Every name burns. The robes fall empty.","Eli walks out beside you at dawn.","Months later, you catch yourself humming."],tag:"THE LEDGER BURNS"},
{ic:"Cassette",ic2:"Tape",need:["cassette"],nt:"Needs the tape.",l:"Play the tape",
 t:["Eli's own voice fills the hall.","The forty remember who they were.","You leave holding his hand. The chair is not empty when you look back."],tag:"THE TAPE PLAYS"},
{ic:"Chair",ic2:"",need:[],l:"Take his place",
 t:["Eli runs. You sit.","The hum is almost kind.","In the ledger, a new line appears: No. 10. Vessel. Always."],tag:"THE VESSEL"}];

/* ---------- state ---------- */
const KEY="hollow-choir-v2";
const fresh=()=>({ch:-1,inv:[],clues:[],seen:{},solved:false,end:null});
let S=load()||fresh(),U=null,msg="",bad=false,hn={},mx=null,my=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const has=i=>S.inv.includes(i);
const $=id=>document.getElementById(id);
const tk=a=>a.map(t=>P[t]?ico(t,24):`<span>${t}</span>`).join("");

/* ---------- render ---------- */
function bar(){return `<div class="bar"><span class="pips">${CH.map((_,i)=>`<i class="${i<=S.ch?'on':''}"></i>`).join("")}</span><span><button class="sm" id="snd" onclick="snd()">Sound: off</button> <button class="sm" onclick="reset()">Restart</button></span></div>`}

function render(){
 const A=$("app");
 if(S.ch<0){
  A.innerHTML=bar()+`<div class="title"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="20" fill="none" stroke="#d4cdb8" stroke-width="3"/><circle class="br" cx="60" cy="60" r="38" fill="none" stroke="#8a8776" stroke-width="2"/><circle class="br" cx="60" cy="60" r="54" fill="none" stroke="#4a4a42" stroke-width="2"/></svg><h1>The Hollow Choir</h1><button onclick="start()">Begin</button><p style="color:var(--dim);font-size:.9rem;margin-top:30px">Best played in the dark, with sound.</p></div>`;
  return;
 }
 if(S.end!==null){
  const e=END[S.end];
  A.innerHTML=bar()+`<div class="title end">${ico(e.ic,90,'#d4cdb8')}${e.ic2?ico(e.ic2,90):''}${e.t.map(l=>`<p>${l}</p>`).join("")}<p class="tag">${e.tag}</p><button onclick="reset(1)">Play again</button></div>`;
  return;
 }
 const c=CH[S.ch];
 let svg=`<svg id="scene" viewBox="0 0 800 450" role="group" aria-label="${c.t}">${DEFS}${c.bg(S)}`;
 c.objs.forEach((o,i)=>{
  const seen=S.seen[S.ch+"-"+i];
  svg+=`<g class="o" tabindex="0" role="button" aria-label="${o.n}" onclick="spot(${i})" onkeydown="if(event.key==='Enter')spot(${i})">${o.a(S)}<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="transparent"/>${seen?'':`<circle class="pu" cx="${o.x+o.w/2}" cy="${o.y+o.h/2}" r="5"/>`}</g>`;
 });
 svg+='<rect width="800" height="450" filter="url(#gr)" opacity=".55" style="pointer-events:none"/></svg>';
 A.innerHTML=bar()+`<div id="wrap">${svg}${c.dark?'<div id="dark"></div>':''}<div id="tip"></div><div id="ov">${overlay(c)}</div></div><div id="cap" class="${bad?'bad':''}" aria-live="polite">${msg||c.intro}</div><div id="inv">${inv()}</div>`;
 if(mx!==null){$("wrap").style.setProperty("--x",mx+"px");$("wrap").style.setProperty("--y",my+"px")}
}

function inv(){
 return `<div class="grp">${S.inv.map(i=>`<span title="${NAME[i]}">${ico(ICN[i],34,'#cfc8b4')}</span>`).join("")||'<span style="color:var(--dim)">&nbsp;</span>'}</div><div class="grp">${S.clues.map(c=>`<span class="chip">${tk(c)}</span>`).join("")}</div>`;
}

function overlay(c){
 if(S.solved){
  if(c.final) return `<div class="box"><div class="row">${END.map((e,i)=>{const ok=e.need.every(has);return `<button ${ok?"":"disabled"} title="${ok?e.l:e.nt}" onclick="finish(${i})" style="padding:14px 18px"><div>${ico(e.ic,44)}${e.ic2?ico(e.ic2,44):''}</div><div style="font-size:.85rem;margin-top:4px">${e.l}</div></button>`}).join("")}</div></div>`;
  return `<div class="box"><button onclick="next()" style="font-size:1.4rem;padding:.4em 1.2em">▼</button></div>`;
 }
 if(!U)return "";
 const p=c.pz;let h=`<div class="box" id="box">`;
 if(p.q)h+=`<div class="row">${tk(p.q)}<span style="font-size:1.6rem">= ?</span></div>`;
 if(p.type==="dial"){
  h+=`<div class="row">${U.v.map((d,k)=>`<div class="col"><button class="sm" onclick="adj(${k},1)">▲</button><div class="dg">${d}</div><button class="sm" onclick="adj(${k},-1)">▼</button></div>`).join("")}</div>`;
 } else if(p.type==="shift"){
  const dec=p.word.split("").map(ch=>String.fromCharCode((ch.charCodeAt(0)-65-U.v[0]+26)%26+65)).join("");
  h+=`<div class="lt" style="color:var(--dim)">${p.word}</div><div class="row"><button class="sm" onclick="adj(0,-1)">◀</button><div class="dg">${U.v[0]}</div><button class="sm" onclick="adj(0,1)">▶</button></div><div class="lt" style="color:var(--lamp)">${dec}</div>`;
 } else {
  h+=`<div class="row">${[...Array(p.n)].map((_,i)=>`<div class="slot">${U.v[i]?ico(U.v[i],34):""}</div>`).join("")}</div><div class="row">${["Candle","Bell","Crow","Moon"].map(n=>`<button onclick="pick('${n}')" aria-label="${n}" style="padding:8px 12px">${ico(n,34)}</button>`).join("")}</div>`;
 }
 h+=`<div class="row"><button onclick="check()">OK</button>${p.type==="seq"?'<button class="sm" onclick="U.v=[];render()">Clear</button>':''}<button class="sm" onclick="hint()">?</button><button class="sm" onclick="U=null;render()">✕</button></div></div>`;
 return h;
}

/* ---------- actions ---------- */
function say(m,b){msg=m;bad=!!b;render()}
function start(){S.ch=0;save();render()}
function spot(i){
 const c=CH[S.ch],o=c.objs[i];
 if(o.need&&!has(o.need)){say(o.nc,1);return}
 S.seen[S.ch+"-"+i]=1;
 if(o.clue&&!S.clues.some(x=>x.join()==o.clue.join()))S.clues.push(o.clue);
 if(o.item&&!has(o.item))S.inv.push(o.item);
 save();
 if(o.puz&&!S.solved){const p=c.pz;U={v:p.type==="dial"?Array(p.n).fill(0):p.type==="shift"?[0]:[]};}
 say(o.puz&&S.solved?"Open.":o.cap);whisper();
}
function adj(k,d){const m=CH[S.ch].pz.type==="shift"?26:10;U.v[k]=(U.v[k]+d+m)%m;render()}
function pick(n){if(U.v.length<CH[S.ch].pz.n)U.v.push(n);render()}
function check(){
 const c=CH[S.ch],p=c.pz;
 const ok=p.type==="dial"?U.v.join("")===p.ans:p.type==="shift"?U.v[0]===p.ans:U.v.join("|")===p.ans.join("|");
 if(ok){
  S.solved=true;c.reward.forEach(i=>{if(!has(i))S.inv.push(i)});U=null;save();say(c.win);
 } else {
  if(p.type==="seq")U.v=[];
  say("Nothing. The humming notices.",1);
  const b=$("box");if(b)b.classList.add("shake");
 }
}
function hint(){const p=CH[S.ch].pz;hn[S.ch]=Math.min((hn[S.ch]||0)+1,p.hints.length);const m=p.hints[hn[S.ch]-1];const el=$("cap");if(el){el.textContent=m;el.className=""}}
function next(){S.ch++;S.solved=false;U=null;msg="";bad=false;save();render()}
function finish(i){S.end=i;save();render()}
function reset(f){if(f||confirm("Start over?")){S=fresh();U=null;msg="";hn={};save();render()}}

/* ---------- mood ---------- */
const W=["it knows your name","behind you","eli is not eli","hum with us","you are already inside"];
function whisper(){if(Math.random()>.25)return;const w=$("whisper");w.textContent=W[Math.floor(Math.random()*W.length)];w.style.opacity=.8;setTimeout(()=>w.style.opacity=0,1800)}
document.addEventListener("pointermove",e=>{const w=$("wrap");if(!w)return;const g=e.target.closest&&e.target.closest(".o"),t=$("tip");if(t){if(g){t.textContent=g.getAttribute("aria-label");t.style.display="block";t.style.left=Math.min(e.clientX-w.getBoundingClientRect().left+14,w.clientWidth-120)+"px";t.style.top=(e.clientY-w.getBoundingClientRect().top+14)+"px"}else t.style.display="none"}const r=w.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;w.style.setProperty("--x",mx+"px");w.style.setProperty("--y",my+"px")});
let ctx=null,nodes=[];
function snd(){
 const b=$("snd");
 if(nodes.length){nodes.forEach(n=>n.stop());nodes=[];b.textContent="Sound: off";return}
 try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const g=ctx.createGain();g.gain.value=.05;g.connect(ctx.destination);
 [55,55.7,82.4].forEach(f=>{const o=ctx.createOscillator();o.frequency.value=f;o.connect(g);o.start();nodes.push(o)});b.textContent="Sound: on"}catch(e){}
}
render();
</script>
